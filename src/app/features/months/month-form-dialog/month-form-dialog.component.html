<h2 mat-dialog-title>{{ isEdit ? 'Modifier le mois' : 'Nouveau mois' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Annee</mat-label>
      <input matInput type="number" formControlName="year" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Mois</mat-label>
      <mat-select formControlName="monthNumber">
        @for (month of monthOptions; track month.value) {
          <mat-option [value]="month.value">{{ month.name }}</mat-option>
        }
      </mat-select>
      @if (form.controls.monthNumber.hasError('required')) {
        <mat-error>Le mois est requis</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Annuler</button>
    <button mat-flat-button color="primary" type="submit">Enregistrer</button>
  </mat-dialog-actions>
</form>
