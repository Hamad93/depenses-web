<h2 mat-dialog-title>{{ isEdit ? 'Modifier la categorie' : 'Nouvelle categorie' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Libelle</mat-label>
      <input matInput formControlName="label" placeholder="ex: Habitation" />
      @if (form.controls.label.hasError('required')) {
        <mat-error>Le libelle est requis</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Annuler</button>
    <button mat-flat-button color="primary" type="submit">Enregistrer</button>
  </mat-dialog-actions>
</form>
